# Scale experiment: 7B model
# Run on Kaggle with GPU T4 x2, Internet On
# 7B fits on T4 with QLoRA (4-bit quantization)

policy:
  model_name: "Qwen/Qwen2.5-7B-Instruct"
  lora:
    r: 32
    lora_alpha: 64
    target_modules: ["q_proj", "v_proj", "k_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
    lora_dropout: 0.05
  dtype: "auto"
  max_seq_len: 1024
  quantization: "4bit"  # QLoRA for T4

generation:
  k: 8
  temperature: 0.7
  top_p: 0.95
  batch_size: 8  # Smaller batch for 7B
  max_new_tokens: 512

training:
  epochs_per_round: 1
  lr: 2e-5  # Lower LR for larger model
  lr_scheduler: "cosine"
  warmup_ratio: 0.1
  weight_decay: 0.01
  bf16: true

data:
  train_size: 200
  test_size: 1319
  dataset: "openai/gsm8k"

verifier:
  type: "oracle"
  match_acceptance_rate: false

loop:
  architecture: "star"
  rounds: 5
  fixed_data: false

eval:
  batch_size: 16

run:
  name: "scale_7b"
  seed: 0
  output_dir: "artifacts/scale/7b_s0"
