run:
  name: scale_1_5b
  seed: 0
  rounds: 5
  output_dir: artifacts/scale/1_5b_s0
  use_wandb: false

data:
  dataset: gsm8k
  train_size: 200
  test_size: 1319

model:
  policy: Qwen/Qwen2.5-1.5B-Instruct
  dtype: float16
  device: cuda
  device_index: 0
  judge: null

generation:
  k_samples: 8
  temperature: 0.7
  top_p: 0.95
  max_new_tokens: 512
  batch_size: 32

verifier:
  type: oracle
  match_acceptance_rate: false

loop:
  architecture: star
  frozen_reference_diversity: true
  fixed_data: false

training:
  method: lora
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  learning_rate: 0.00004
  epochs: 1
  batch_size: 4
  grad_accum: 4
  max_seq_len: 512
  precision: auto

diversity:
  output_entropy: true
  embedding_clustering: false
  self_bleu: true

stats:
  bootstrap_samples: 500
  ci_alpha: 0.05
  plateau_abs_delta: 0.005
  plateau_consecutive: 2
